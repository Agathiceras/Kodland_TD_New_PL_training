<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parallel Lessons Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/training.css">
</head>
<body>
<nav class="nav" id="nav"></nav>
<main id="view"></main>
<div class="ovl" id="modal"></div>
<div class="ovl lb" id="lb"><img id="lbImg" alt=""></div>
<canvas id="confetti"></canvas>
<footer class="foot"><span id="footText"></span><button id="devLink"></button></footer>

<!-- 1) Available languages -->
<script src="content/languages.js"></script>
<!-- 2) Content of the chosen language: PL_Training.html?lang=it loads content/it.js (default: English) -->
<script>
  (function(){
    // Any content/<code>.js in the folder works with ?lang=<code>, even before it is listed in languages.js
    var q = ((location.search.match(/[?&]lang=([a-z-]+)/i) || [])[1] || 'en').toLowerCase();
    document.write('<script src="content/' + q + '.js"><\/script>');
  })();
</script>
<script>
  // File missing? Fall back to English
  if (!window.PL_CONTENT) document.write('<script src="content/en.js"><\/script>');
</script>
<!-- 3) The engine (no texts inside) -->
<script src="assets/engine.js"></script>
</body>
</html>
